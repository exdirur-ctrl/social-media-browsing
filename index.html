
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Browsing</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: #111827;
  border-bottom: 1px solid #252e40;
}

header h1 {
  font-size: 27px;
  color: #25f4ee;
}

header p {
  color: #aaa;
  margin-top: 12px;
}

.container {
  max-width: 600px;
  margin: 45px auto;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 30px;
}

.social {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px;
  margin-bottom: 18px;
  background: #171e2c;
  border: 1px solid #293448;
  border-radius: 15px;
}

.social h3 {
  font-size: 21px;
}

.social a {
  text-decoration: none;
  color: white;
  background: #e72b50;
  padding: 12px 17px;
  border-radius: 9px;
  font-weight: bold;
}

.tiktok a {
  background: #e72b50;
}

.instagram a {
  background: #a52eea;
}

.youtube a {
  background: #d92323;
}

.social a:hover {
  opacity: .8;
}

footer {
  text-align: center;
  color: #777;
  padding: 30px 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>Social Media Browsing</h1>
  <p>All your favorite platforms in one place</p>
</header>

<div class="container">

  <h2>Choose Your Platform</h2>

  <div class="social tiktok">
    <h3>TikTok ♪</h3>
    <a href="https://www.tiktok.com/" target="_blank">Open</a>
  </div>

  <div class="social instagram">
    <h3>Instagram</h3>
    <a href="https://www.instagram.com/" target="_blank">Open</a>
  </div>

  <div class="social youtube">
    <h3>YouTube ▶</h3>
    <a href="https://www.youtube.com/" target="_blank">Open</a>
  </div>

</div>

<footer>
  Social Media Browsing © 2026
</footer>

</body>
</html>
